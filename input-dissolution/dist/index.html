</a><svg
      class="sr-only"
      height="0"
      width="0"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <defs>
        <filter
          id="dissolve"
          color-interpolation-filters="sRGB"
          overflow="visible"
        >
          <feTurbulence
            id="fractalOne"
            type="turbulence"
            baseFrequency="0.1"
            numOctaves="100"
            result="bigNoise"
            seed="431"
          ></feTurbulence>
          <feDisplacementMap
            id="displacement"
            in="SourceGraphic"
            scale="11"
          ></feDisplacementMap>
        </filter>
        <filter
          id="displace"
          color-interpolation-filters="sRGB"
          overflow="visible"
        >
          <feTurbulence
            id="fractalOne"
            type="turbulence"
            baseFrequency="0.1"
            numOctaves="100"
            result="bigNoise"
            seed="431"
          ></feTurbulence>
        </filter>
      </defs>
    </svg>
    <main class="text-4xl relative leading-none">
      <form class="flex items-baseline">
        <div class="input relative">
          <div class="filter-layer layer inset-4 absolute pointer-events-none">
            <span
              class="label font-mono text-base absolute bottom-[calc(100%+6px)] right-[-7px] px-2 bg-[canvasText] [color:canvas]"
              >filtered</span
            >
            <div class="debug-wrapper h-full overflow-auto">
              <div class="filter-dupe dupe filter-debug filtered h-full"></div>
            </div>
          </div>
          <div class="input-layer layer inset-4 absolute pointer-events-none">
            <span
              class="label font-mono text-base absolute bottom-[calc(100%+6px)] right-[-7px] px-2 bg-[canvasText] [color:canvas]"
              >input</span
            >
            <div class="debug-wrapper h-full overflow-auto">
              <div class="input-debug dupe h-full"></div>
            </div>
          </div>
          <div
            class="displace-layer layer inset-4 absolute pointer-events-none"
          >
            <span
              class="label font-mono text-base absolute bottom-[calc(100%+6px)] right-[-7px] px-2 bg-[canvasText] [color:canvas]"
              >displace</span
            >
            <div class="debug-wrapper h-full overflow-auto">
              <div class="displace-debug h-full bg-current"></div>
            </div>
          </div>
          <div class="wrap relative p-4">
            <input
              class="outline-offset-[1rem] w-[360px]"
              autocomplete="off"
              spellcheck="false"
              id="text"
              placeholder="rockstar@ui.dev"
              type="email"
              required
            />
            <div
              aria-hidden="true"
              class="dupe filtered absolute inset-4 overflow-auto pointer-events-none whitespace-nowrap [mix-blend-mode:plus-lighter]"
            ></div>
            <div
              aria-hidden="true"
              class="displacer absolute inset-0 pointer-events-none"
            ></div>
          </div>
        </div>
        <button
          aria-label="Enlist"
          class="uppercase font-mono opacity-50 hover:opacity-100 motion-safe:transition-opacity text-lg"
        >
          [ENLIST]
        </button>
      </form>
    </main>
