
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.wrap { padding: 1rem 0 1.5rem; font-family: var(--font-sans); }
.tabs { display: flex; gap: 4px; margin-bottom: 1.25rem; }
.tab { font-size: 12px; padding: 5px 12px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); color: var(--color-text-secondary); cursor: pointer; background: transparent; transition: all 0.15s; }
.tab.active { background: var(--color-background-secondary); color: var(--color-text-primary); border-color: var(--color-border-primary); font-weight: 500; }
.insight { display: flex; align-items: center; gap: 8px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 14px; margin-bottom: 1.25rem; font-size: 12px; color: var(--color-text-secondary); }
.insight strong { color: var(--color-text-primary); font-weight: 500; }

.heatmap-section { display: none; }
.heatmap-section.show { display: block; }
.grid { display: grid; gap: 3px; min-width: 400px; }
.day-label { font-size: 11px; color: var(--color-text-tertiary); text-align: center; padding-bottom: 4px; }
.hour-label { font-size: 11px; color: var(--color-text-tertiary); text-align: right; padding-right: 8px; line-height: 18px; height: 18px; }
.cell { height: 18px; border-radius: 3px; cursor: default; }
.cell:hover { opacity: 0.7; }

.groups-section { display: none; }
.groups-section.show { display: block; }
.day-block { margin-bottom: 1.25rem; }
.day-title { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
.group-row { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 8px; margin-bottom: 6px; }
.group-name { font-size: 12px; color: var(--color-text-secondary); text-align: right; }
.hour-track { position: relative; height: 20px; background: var(--color-background-secondary); border-radius: 4px; overflow: hidden; }
.hour-block { position: absolute; top: 2px; height: 16px; border-radius: 3px; cursor: default; transition: opacity 0.15s; }
.hour-block:hover { opacity: 0.75; }
.track-labels { display: grid; grid-template-columns: 64px 1fr; gap: 8px; margin-bottom: 4px; }
.time-axis { display: flex; justify-content: space-between; padding: 0 2px; }
.time-tick { font-size: 10px; color: var(--color-text-tertiary); }

.legend-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--color-text-secondary); }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
</style>

<div class="wrap">
  <div class="tabs">
    <button class="tab active" onclick="showTab('heatmap',this)">Heatmap</button>
    <button class="tab" onclick="showTab('groups',this)">By group</button>
  </div>

  <div class="insight">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0"><circle cx="7" cy="7" r="6" stroke="var(--color-text-warning)" stroke-width="1.2"/><rect x="6.3" y="3.5" width="1.4" height="4" rx="0.7" fill="var(--color-text-warning)"/><circle cx="7" cy="9.8" r="0.8" fill="var(--color-text-warning)"/></svg>
    Peak activity <strong>Sunday 19:00–22:00</strong> &nbsp;·&nbsp; Group 3 only worked on the due date &nbsp;·&nbsp; Group 8 never edited
  </div>

  <div class="heatmap-section show" id="heatmap-section">
    <div style="overflow-x:auto">
      <div class="grid" id="heatmap" style="grid-template-columns: 52px repeat(7,1fr)"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--color-text-tertiary)">
      <span>Less</span>
      <div style="display:flex;gap:3px" id="hm-legend"></div>
      <span>More</span>
    </div>
  </div>

  <div class="groups-section" id="groups-section">
    <div id="group-days"></div>
    <div class="legend-row" id="group-legend"></div>
  </div>
</div>

<script>
const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const hours = Array.from({length:24},(_,i)=>i);

const groupColors = {
  'Group 1': '#378ADD',
  'Group 2': '#1D9E75',
  'Group 3': '#EF9F27',
  'Group 4': '#D4537E',
  'Group 5': '#7F77DD',
  'Group 6': '#D85A30',
  'Group 7': '#639922',
  'Group 8': '#B4B2A9',
};

const groupActivity = {
  Mon: { 'Group 1': [9,10,20], 'Group 2': [19,20,21], 'Group 4': [10,15] },
  Tue: { 'Group 1': [20,21], 'Group 2': [10,15,16], 'Group 5': [19,20] },
  Wed: { 'Group 2': [16,17], 'Group 3': [20,21,22], 'Group 4': [9,20,21], 'Group 6': [19,20] },
  Thu: { 'Group 1': [19,20,21], 'Group 2': [11,20,21,22], 'Group 5': [14,19,20], 'Group 7': [16,17] },
  Fri: { 'Group 1': [18,19,20,21], 'Group 2': [19,20,21,22], 'Group 3': [20,21,22], 'Group 4': [15,16,19,20], 'Group 6': [10,20,21], 'Group 7': [19,20,21,22] },
  Sat: { 'Group 1': [10,11,19,20,21], 'Group 4': [14,15,16,19,20,21], 'Group 5': [10,11,19,20], 'Group 7': [11,14,19,20,21] },
  Sun: { 'Group 1': [19,20,21], 'Group 2': [9,10,11,19,20,21,22,23], 'Group 3': [20,21,22,23], 'Group 4': [18,19,20,21,22], 'Group 5': [19,20,21,22], 'Group 6': [16,19,20,21], 'Group 7': [19,20,21] },
};

const heatRaw = {};
days.forEach(d => {
  heatRaw[d] = {};
  Object.values(groupActivity[d]||{}).forEach(hrs => hrs.forEach(h => { heatRaw[d][h] = (heatRaw[d][h]||0)+1; }));
});
const maxVal = Math.max(...Object.values(heatRaw).flatMap(d=>Object.values(d)));

function hmColor(t) {
  if(t===0) return 'var(--color-background-secondary)';
  if(t<0.2) return '#C0DD97';
  if(t<0.4) return '#97C459';
  if(t<0.65) return '#639922';
  if(t<0.85) return '#3B6D11';
  return '#27500A';
}

const grid = document.getElementById('heatmap');
grid.innerHTML += '<div></div>';
days.forEach(d => { const el=document.createElement('div'); el.className='day-label'; el.textContent=d; grid.appendChild(el); });
hours.forEach(h => {
  const lbl=document.createElement('div'); lbl.className='hour-label';
  lbl.textContent = h%4===0 ? String(h).padStart(2,'0')+':00' : '';
  grid.appendChild(lbl);
  days.forEach(d => {
    const v=(heatRaw[d]&&heatRaw[d][h])||0;
    const cell=document.createElement('div'); cell.className='cell';
    cell.style.background=hmColor(v/maxVal);
    cell.title=`${d} ${String(h).padStart(2,'0')}:00 — ${v} group${v!==1?'s':''} active`;
    grid.appendChild(cell);
  });
});
const hmLeg=['var(--color-background-secondary)','#C0DD97','#97C459','#639922','#3B6D11','#27500A'];
hmLeg.forEach(c=>{ const el=document.createElement('div'); el.style.cssText=`width:14px;height:14px;border-radius:2px;background:${c}`; document.getElementById('hm-legend').appendChild(el); });

const activeDays = days.filter(d => Object.keys(groupActivity[d]||{}).length > 0);
const gdiv = document.getElementById('group-days');
const trackW = 100;

activeDays.forEach(d => {
  const db = document.createElement('div'); db.className='day-block';
  db.innerHTML=`<div class="day-title">${d}</div>`;

  const axisRow=document.createElement('div'); axisRow.className='track-labels';
  axisRow.innerHTML=`<div></div><div class="time-axis"><span class="time-tick">00:00</span><span class="time-tick">06:00</span><span class="time-tick">12:00</span><span class="time-tick">18:00</span><span class="time-tick">24:00</span></div>`;
  db.appendChild(axisRow);

  const grps = Object.keys(groupActivity[d]);
  grps.forEach(g => {
    const row=document.createElement('div'); row.className='group-row';
    const nm=document.createElement('div'); nm.className='group-name'; nm.textContent=g;
    const track=document.createElement('div'); track.className='hour-track';

    groupActivity[d][g].forEach(h => {
      const block=document.createElement('div'); block.className='hour-block';
      const left = (h/24)*100;
      const width = (1/24)*100;
      block.style.left=left+'%';
      block.style.width=`calc(${width}% - 1px)`;
      block.style.background=groupColors[g];
      block.title=`${g} · ${d} ${String(h).padStart(2,'0')}:00–${String(h+1).padStart(2,'0')}:00`;
      track.appendChild(block);
    });

    row.appendChild(nm); row.appendChild(track); db.appendChild(row);
  });
  gdiv.appendChild(db);
});

const legDiv=document.getElementById('group-legend');
Object.entries(groupColors).forEach(([g,c])=>{
  const item=document.createElement('div'); item.className='legend-item';
  item.innerHTML=`<span class="legend-dot" style="background:${c}"></span><span>${g}</span>`;
  legDiv.appendChild(item);
});

function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('heatmap-section').classList.toggle('show', name==='heatmap');
  document.getElementById('groups-section').classList.toggle('show', name==='groups');
}
</script>
